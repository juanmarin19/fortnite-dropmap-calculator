<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortnite Dropmap Calculator (Open Source)</title>
    <meta name="description" content="Drop calculator open-source: destino, bus, salto, despliegue, corte y reapertura. Réplica del concepto Titan Dropcalc." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="map"></div>

    <header id="topbar">
      <nav aria-label="Navegación principal">
        <a class="brand" href="./">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3b82f6" />
                <stop offset="1" stop-color="#60a5fa" />
              </linearGradient>
            </defs>
            <rect width="40" height="40" rx="11" fill="url(#lg)" />
            <path d="M9 21.5 Q20 8 31 21.5 Z" fill="#fff" />
            <path d="M9 21.5 18.5 30.5M31 21.5 21.5 30.5M20 21.5V30.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" />
            <circle cx="20" cy="32" r="2.6" fill="#fff" />
          </svg>
          <span class="wordmark">Dropmap<br /><span>Calculator</span></span>
        </a>
      </nav>
    </header>

    <div id="controls">
      <button id="clearAll" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 11v6" /><path d="M14 11v6" />
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
          <path d="M3 6h18" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
        <span>Clear All</span>
      </button>
      <button id="clearBus" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6 2 7" /><path d="M10 6h4" /><path d="m22 7-2-1" />
          <rect width="16" height="16" x="4" y="3" rx="2" /><path d="M4 11h16" />
          <path d="M8 15h.01" /><path d="M16 15h.01" /><path d="M6 19v2" /><path d="M18 21v-2" />
        </svg>
        <span>Clear Bus</span>
      </button>
    </div>

    <div id="toast"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
